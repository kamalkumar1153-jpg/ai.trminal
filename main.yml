name: Market Data Auto Sync

on:
  schedule:
    - cron: '*/5 * * * *' # हर 5 मिनट में अपने आप चलेगा
  workflow_dispatch:      # जब आप चाहें बटन दबाकर चला सकें

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: python bot.py
