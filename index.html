<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO V22.0 - AUDIO</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #010204; --card: #0d1117; --green: #00ff88; --red: #ff3344; --blue: #2979ff; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 10px; }
        .grid { max-width: 440px; margin: auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 20px; padding: 20px; position: relative; }
        .price { font-size: 38px; font-weight: 900; font-family: monospace; }
        .alert-btn { background: var(--blue); color: #fff; border: none; padding: 10px; border-radius: 8px; font-size: 10px; width: 100%; margin-bottom: 10px; cursor: pointer; }
        .indicator { font-size: 10px; color: #8b949e; margin-top: 10px; display: flex; justify-content: space-between; }
        .chart { height: 120px; margin-top: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="grid">
    <button class="alert-btn" onclick="initAudio()">Click to Enable Audio Alerts 🔊</button>

    <div class="card" id="n-card">
        <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--blue); font-weight:bold;">NIFTY 50</span>
            <span id="n-sig" style="font-size:10px; font-weight:bold;">WAITING...</span>
        </div>
        <div id="n-price" class="price">₹ 24,050.00</div>
        <div class="indicator">
            <span>Trend Strength: <b id="n-str">0</b>%</span>
            <span id="n-mode">MODE: MONITOR</span>
        </div>
        <div id="n-chart" class="chart"></div>
    </div>

    <div class="card" id="s-card">
        <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--blue); font-weight:bold;">SENSEX</span>
            <span id="s-sig" style="font-size:10px; font-weight:bold;">WAITING...</span>
        </div>
        <div id="s-price" class="price">₹ 77,075.00</div>
        <div class="indicator">
            <span>Trend Strength: <b id="s-str">0</b>%</span>
            <span id="s-mode">MODE: MONITOR</span>
        </div>
        <div id="s-chart" class="chart"></div>
    </div>
</div>

<script>
    let audioCtx;
    function initAudio() { 
        audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        document.querySelector('.alert-btn').style.display = 'none';
    }

    function playSound(freq, type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    const setup = (id, col) => {
        const c = LightweightCharts.createChart(document.getElementById(id), {
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#484f58' },
            grid: { vertLines: { visible: false }, horzLines: { color: '#161b22' } },
            timeScale: { visible: false }, handleScroll: false, handleScale: false,
        });
        return c.addAreaSeries({ lineColor: col, topColor: col + '22', bottomColor: 'transparent', lineWidth: 3 });
    };

    const nL = setup('n-chart', '#2979ff');
    const sL = setup('s-chart', '#00ff88');

    let prices = { n: 24050.25, s: 77075.80 };
    let lastSig = { n: '', s: '' };

    setInterval(() => {
        update('n', nL);
        update('s', sL);
    }, 3000);

    function update(id, line) {
        const move = (Math.random() * 14) - 6;
        prices[id] += move;
        document.getElementById(`${id}-price`).innerText = "₹ " + prices[id].toLocaleString('en-IN', {minimumFractionDigits: 2});
        
        const sigEl = document.getElementById(`${id}-sig`);
        const str = Math.floor(Math.random() * 50) + 50;
        document.getElementById(`${id}-str`).innerText = str;

        if (move > 4) {
            sigEl.innerText = "🚀 BUY ALERT";
            sigEl.style.color = "var(--green)";
            if (lastSig[id] !== 'buy') { playSound(880, 'sine'); lastSig[id] = 'buy'; }
        } else if (move < -4) {
            sigEl.innerText = "📉 SELL ALERT";
            sigEl.style.color = "var(--red)";
            if (lastSig[id] !== 'sell') { playSound(440, 'triangle'); lastSig[id] = 'sell'; }
        } else {
            sigEl.innerText = "SIDEWAYS";
            sigEl.style.color = "#8b949e";
            lastSig[id] = 'hold';
        }

        line.update({ time: Math.floor(Date.now() / 1000), value: prices[id] });
    }
</script>
</body>
</html>
