<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Terminal - Ichimoku Chart</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: #161b22; padding: 15px; border-radius: 20px; border: 1px solid #30363d; }
        .market-card { background: #21262d; margin: 10px 0; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #58a6ff; }
        .price { font-size: 18px; font-weight: bold; color: #3fb950; }
        
        /* Chart Styling */
        .chart-container { height: 350px; margin: 15px 0; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
        
        #signal-box { font-size: 18px; font-weight: bold; padding: 10px; border-radius: 8px; background: #21262d; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #58a6ff; margin: 5px 0;">🚀 AI PRO TERMINAL</h2>
    
    <div style="display: flex; gap: 10px;">
        <div class="market-card" style="flex: 1; border-left-color: #3fb950;">
            <span style="font-size: 12px;">NIFTY</span>
            <span id="nifty-price" class="price">0.00</span>
        </div>
        <div class="market-card" style="flex: 1; border-left-color: #ff7b72;">
            <span style="font-size: 12px;">SENSEX</span>
            <span id="sensex-price" class="price">0.00</span>
        </div>
    </div>

    <div class="chart-container">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div id="tradingview_ichimoku" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "NSE:NIFTY",
            "interval": "15",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "in",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_top_toolbar": true,
            "save_image": false,
            "container_id": "tradingview_ichimoku",
            "studies": [
              "IchimokuCloud@tv-basicstudies"
            ]
          });
          </script>
        </div>
        </div>

    <div id="signal-box">SCANNING TREND...</div>
    
    <div id="update-time" style="font-size: 10px; color: #8b949e;">Live Syncing...</div>
</div>

<script>
    const BRIDGE_URL = "https://ai-trminal.onrender.com/market-data";

    async function updateData() {
        try {
            const res = await fetch(BRIDGE_URL);
            const data = await res.json();
            const nifty = data.data["NSE_INDEX:Nifty 50"].last_price;
            const sensex = (data.data["BSE_INDEX:SENSEX"] || data.data["NSE_INDEX:SENSEX"]).last_price;

            document.getElementById('nifty-price').innerText = nifty.toFixed(2);
            document.getElementById('sensex-price').innerText = sensex.toFixed(2);

            const sigEl = document.getElementById('signal-box');
            if(nifty > 24055) {
                sigEl.innerText = "🚀 BULLISH TREND";
                sigEl.style.color = "#3fb950";
            } else {
                sigEl.innerText = "🔻 BEARISH TREND";
                sigEl.style.color = "#f85149";
            }
            document.getElementById('update-time').innerText = "Last Update: " + new Date().toLocaleTimeString();
        } catch (e) {
            console.log("Error fetching bridge data");
        }
    }

    setInterval(updateData, 5000);
    updateData();
</script>

</body>
</html>
