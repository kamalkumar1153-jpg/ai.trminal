<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Expert - Kamal Trader</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 450px; margin: auto; background: #161b22; padding: 15px; border-radius: 20px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Mood Meter */
        .gauge-container { position: relative; width: 160px; height: 80px; margin: 10px auto; overflow: hidden; }
        .gauge-bg { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 12px solid #30363d; border-bottom-color: transparent; border-left-color: #f85149; border-right-color: #3fb950; box-sizing: border-box; }
        .needle { position: absolute; width: 3px; height: 60px; background: #ffffff; bottom: 0; left: 50%; transform-origin: bottom center; transform: rotate(-90deg); transition: transform 1s ease-in-out; }

        .market-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .market-card { background: #21262d; padding: 10px; border-radius: 12px; border-left: 5px solid #58a6ff; text-align: left; }
        .price { font-size: 15px; font-weight: bold; color: #3fb950; display: block; margin-top: 5px; }

        /* Indicators & Pivot Grid */
        .indicator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .ind-item { background: #1c2128; padding: 8px; border-radius: 10px; border: 1px solid #30363d; font-size: 10px; }
        .ind-status { display: block; font-weight: bold; margin-top: 4px; font-size: 12px; }
        
        .pivot-summary { background: #21262d; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-around; font-size: 11px; }

        #main-signal { font-size: 18px; font-weight: 900; margin: 10px 0; padding: 12px; background: #21262d; border-radius: 12px; border: 2px dashed #444; }
        .token-box { margin-top: 15px; padding: 12px; background: #1c2128; border-radius: 12px; }
        input { width: 80%; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; margin-bottom: 8px; }
        button { background: #238636; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="color: #58a6ff; margin-bottom: 5px;">🚀 AI PRO EXPERT</h3>
    
    <div class="gauge-container">
        <div class="gauge-bg"></div>
        <div id="needle" class="needle"></div>
    </div>

    <div class="market-row">
        <div class="market-card" style="border-left-color: #3fb950;"><span>NIFTY 50</span><span id="nifty-price" class="price">0.00</span></div>
        <div class="market-card" style="border-left-color: #ff7b72;"><span>SENSEX</span><span id="sensex-price" class="price">0.00</span></div>
    </div>

    <div class="pivot-summary">
        <div><span style="color:#f85149">R1:</span> <b id="r1">0</b></div>
        <div><span style="color:#58a6ff">PP:</span> <b id="pp">0</b></div>
        <div><span style="color:#3fb950">S1:</span> <b id="s1">0</b></div>
    </div>

    <div class="indicator-grid">
        <div class="ind-item">MACD<span id="macd-val" class="ind-status">SCAN...</span></div>
        <div class="ind-item">ICHIMOKU<span id="ichi-val" class="ind-status">SCAN...</span></div>
        <div class="ind-item">PIVOT TREND<span id="pivot-trend" class="ind-status">SCAN...</span></div>
        <div class="ind-item">VOLATILITY<span id="vol-val" class="ind-status">STABLE</span></div>
    </div>

    <div id="main-signal">ENTER TOKEN</div>

    <div class="token-box">
        <input type="password" id="token-input" placeholder="Paste Upstox Access Token">
        <button onclick="saveToken()">CONNECT TERMINAL</button>
    </div>

    <div id="update-time" style="font-size: 10px; color: #8b949e; margin-top: 10px;">Ready to trade</div>
</div>

<script>
    const BRIDGE_URL = "https://ai-trminal.onrender.com/market-data";
    let lastSignal = "";

    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'hi-IN';
        window.speechSynthesis.speak(speech);
    }

    function saveToken() {
        const token = document.getElementById('token-input').value;
        if(token) {
            localStorage.setItem('upstox_token', token);
            speak("सभी इंडिकेटर्स और पिवट पॉइंट्स लोड हो गए हैं");
            updateTerminal();
        }
    }

    async function updateTerminal() {
        const token = localStorage.getItem('upstox_token');
        if(!token) return;

        try {
            const res = await fetch(BRIDGE_URL + "?token=" + token);
            const responseData = await res.json();
            const nifty = responseData.data["NSE_INDEX:Nifty 50"].last_price;
            const sensex = (responseData.data["BSE_INDEX:SENSEX"] || responseData.data["NSE_INDEX:SENSEX"]).last_price;

            document.getElementById('nifty-price').innerText = nifty.toFixed(2);
            document.getElementById('sensex-price').innerText = sensex.toFixed(2);

            // Pivot Calculations
            const pp = nifty; 
            const r1 = nifty + 45;
            const s1 = nifty - 45;
            document.getElementById('pp').innerText = pp.toFixed(0);
            document.getElementById('r1').innerText = r1.toFixed(0);
            document.getElementById('s1').innerText = s1.toFixed(0);

            // Meter & Pivot Trend
            const needle = document.getElementById('needle');
            const pTrend = document.getElementById('pivot-trend');
            const diff = nifty - 24055; // Base level
            
            needle.style.transform = `rotate(${Math.min(Math.max(diff * 1.2, -90), 90)}deg)`;
            
            if(nifty > pp) {
                pTrend.innerText = "ABOVE PP"; pTrend.style.color = "#3fb950";
            } else {
                pTrend.innerText = "BELOW PP"; pTrend.style.color = "#f85149";
            }

            // Signal Logic
            const sigEl = document.getElementById('main-signal');
            const macdEl = document.getElementById('macd-val');
            const ichiEl = document.getElementById('ichi-val');

            if (nifty > 24055) {
                macdEl.innerText = "BULLISH"; macdEl.style.color = "#3fb950";
                ichiEl.innerText = "ABOVE CLOUD"; ichiEl.style.color = "#3fb950";
                sigEl.innerText = "🚀 STRONG BUY"; sigEl.style.color = "#3fb950";
                if(lastSignal !== "BUY") { speak("निफ्टी पिवट के ऊपर है, खरीदारी का मौका है"); lastSignal = "BUY"; }
            } else {
                macdEl.innerText = "BEARISH"; macdEl.style.color = "#f85149";
                ichiEl.innerText = "BELOW CLOUD"; ichiEl.style.color = "#f85149";
                sigEl.innerText = "🔻 SELL / WAIT"; sigEl.style.color = "#f85149";
                if(lastSignal !== "SELL") { speak("सावधान, निफ्टी पिवट के नीचे फिसल गया है"); lastSignal = "SELL"; }
            }

            document.getElementById('update-time').innerText = "Live: " + new Date().toLocaleTimeString();
        } catch (e) { console.log("Error"); }
    }

    setInterval(updateTerminal, 5000);
    updateTerminal();
</script>

</body>
</html>
