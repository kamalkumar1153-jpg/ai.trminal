<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TERMINAL PRO</title>
    <style>
        body { background: #0b111e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a2332; margin: 15px auto; padding: 25px; border-radius: 20px; border-left: 6px solid #4285f4; max-width: 400px; }
        .price { font-size: 38px; font-weight: bold; color: #4ade80; margin: 10px 0; }
        .signal { font-size: 28px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🤖 AI LIVE TERMINAL</h2>
    <div class="card"><div>NIFTY 50</div><div id="nifty" class="price">Connecting...</div></div>
    <div class="card"><div>SENSEX</div><div id="sensex" class="price">Connecting...</div></div>
    <div class="card"><div>AI SIGNAL</div><div id="signal" class="signal">SCANNING...</div></div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1IMXl6rCvbTRFNfeypfY4KpEdeFAsnJ0rh04t46ujcoI/export?format=csv';

        async function update() {
            try {
                const res = await fetch(sheetUrl + '&cachebust=' + new Date().getTime());
                const text = await res.text();
                const data = text.split('\n')[0].split(',');

                document.getElementById('nifty').innerText = "₹" + data[0].replace(/"/g, '');
                document.getElementById('sensex').innerText = "₹" + data[1].replace(/"/g, '');
                
                const sig = data[4].replace(/"/g, '');
                const sigBox = document.getElementById('signal');
                sigBox.innerText = sig;
                sigBox.style.color = sig.includes("BUY") ? "#4ade80" : "#f87171";
            } catch (e) {
                document.getElementById('nifty').innerText = "Syncing...";
            }
        }
        setInterval(update, 10000);
        update();
    </script>
</body>
</html>
