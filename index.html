<!DOCTYPE html>
<html>
<head>
<title>AI AUTO TRADER</title>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

<style>
body { background:#0b1220; color:white; text-align:center; font-family:Arial; }
.card { background:#1b2335; padding:15px; margin:10px; border-radius:10px; }
.big { font-size:26px; color:#00ff99; }
.signal { font-size:22px; padding:20px; border-radius:10px; margin:10px; }
</style>
</head>

<body>

<h2>🤖 AI AUTO TRADER</h2>

<div class="card">NIFTY <div id="nifty" class="big">--</div></div>
<div class="card">SENSEX <div id="sensex" class="big">--</div></div>

<div class="card">
<div id="rsi">RSI: --</div>
<div id="macd">MACD: --</div>
</div>

<div class="card">💰 Balance <div id="balance" class="big">--</div></div>

<div id="signal" class="signal">WAIT...</div>

<button onclick="speak()">🔊 Voice</button>

<script>
const firebaseConfig = {
  // apna config
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let lastSignal = "";

db.ref("market_data").on("value", snap => {
    let d = snap.val();
    if (!d) return;

    nifty.innerText = d.nifty;
    sensex.innerText = d.sensex;
    rsi.innerText = "RSI: " + d.rsi;
    macd.innerText = "MACD: " + d.macd;
    balance.innerText = d.balance;
    signal.innerText = d.signal;

    if (d.signal !== lastSignal) {
        speakText(d.signal);
        lastSignal = d.signal;
    }
});

function speakText(text) {
    let s = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(s);
}

function speak() {
    speakText(signal.innerText);
}
</script>

</body>
</html>
