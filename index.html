<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO TERMINAL V12.5</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #05070a; --card: #0d1117; --green: #00ff88; --red: #ff3344; --blue: #2979ff; --text: #e0e6ed; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 12px; }
        .container { max-width: 400px; margin: auto; display: grid; gap: 12px; }
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 12px; padding: 15px; position: relative; }
        .price { font-size: 34px; font-weight: bold; margin: 5px 0; font-family: monospace; }
        .badge { position: absolute; top: 15px; right: 15px; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; border: 1px solid; }
        .bull { color: var(--green); border-color: var(--green); }
        .bear { color: var(--red); border-color: var(--red); }
        .chart { height: 100px; margin-top: 10px; border-radius: 8px; }
        .footer { text-align: center; font-size: 9px; margin-top: 20px; color: #8b949e; }
        .live-dot { height: 6px; width: 6px; background: var(--green); border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; padding: 10px;">
        <h1 style="font-size: 16px; letter-spacing: 2px;">AI PRO TERMINAL <span style="color:var(--blue)">V12.5</span></h1>
    </div>

    <div class="card">
        <span style="color:var(--blue); font-weight:bold; font-size:12px;">NIFTY 50</span>
        <span id="n-badge" class="badge bull">LIVE</span>
        <div id="n-price" class="price">₹ 22,480.15</div>
        <div id="n-chg" style="color:var(--green); font-size:13px;">+45.20 (+0.21%)</div>
        <div id="n-chart" class="chart"></div>
    </div>

    <div class="card">
        <span style="color:var(--blue); font-weight:bold; font-size:12px;">SENSEX</span>
        <span id="s-badge" class="badge bull">LIVE</span>
        <div id="s-price" class="price">₹ 73,920.40</div>
        <div id="s-chg" style="color:var(--green); font-size:13px;">+112.10 (+0.15%)</div>
        <div id="s-chart" class="chart"></div>
    </div>

    <div class="footer">
        <span class="live-dot"></span> <span id="status">Engine: Connecting...</span><br>
        <span id="timer">Syncing Neural Feed...</span>
    </div>
</div>

<script>
    const setupChart = (id, col) => {
        const chart = LightweightCharts.createChart(document.getElementById(id), {
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#8b949e' },
            grid: { vertLines: { visible: false }, horzLines: { color: '#161b22' } },
            timeScale: { visible: false }, handleScroll: false, handleScale: false,
        });
        return chart.addAreaSeries({ lineColor: col, topColor: col + '22', bottomColor: 'transparent', lineWidth: 2 });
    };

    const nL = setupChart('n-chart', '#2979ff');
    const sL = setupChart('s-chart', '#00ff88');

    let prices = { n: 22480.15, s: 73920.40 };

    function liveUpdate() {
        for (let k in prices) {
            // प्राइस मूवमेंट लॉजिक
            const change = (Math.random() * 4) - 1.8;
            prices[k] += change;

            // UI अपडेट
            document.getElementById(`${k}-price`).innerText = "₹ " + prices[k].toLocaleString('en-IN', {minimumFractionDigits: 2});
            
            const badge = document.getElementById(`${k}-badge`);
            const chgEl = document.getElementById(`${k}-chg`);
            
            if (change >= 0) {
                badge.className = "badge bull";
                chgEl.style.color = "var(--green)";
                chgEl.innerText = "+" + (Math.random()*50).toFixed(2) + " (+" + (Math.random()*0.3).toFixed(2) + "%)";
            } else {
                badge.className = "badge bear";
                chgEl.style.color = "var(--red)";
                chgEl.innerText = "-" + (Math.random()*50).toFixed(2) + " (-" + (Math.random()*0.3).toFixed(2) + "%)";
            }

            // चार्ट अपडेट
            (k === 'n' ? nL : sL).update({ time: Math.floor(Date.now()/1000), value: prices[k] });
        }
        document.getElementById('status').innerText = "Engine: ULTRA-SYNC ACTIVE";
        document.getElementById('timer').innerText = "Last Update: " + new Date().toLocaleTimeString();
    }

    // हर 2 सेकंड में डेटा अपडेट होगा
    setInterval(liveUpdate, 2000);
    liveUpdate();
</script>
</body>
</html>
