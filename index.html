<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Scanner Live</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --blue: #58a6ff; --green: #3fb950; --red: #f85149; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 15px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 12px; padding: 15px; position: relative; }
        .price { font-size: 22px; font-weight: bold; margin: 5px 0; color: var(--green); }
        .btn-alert { background: var(--blue); border: none; padding: 12px; color: white; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        .signal-tag { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
        .score-bar { height: 4px; background: #30363d; margin-top: 10px; border-radius: 2px; overflow: hidden; }
        .score-fill { height: 100%; transition: 1s; }
    </style>
</head>
<body>
    <h3>💎 SMART SCANNER</h3>
    <button class="btn-alert" onclick="Notification.requestPermission()">🔔 ENABLE BUY ALERTS</button>

    <div id="grid" class="grid"></div>
    <div id="time" style="font-size: 10px; color: #8b949e; margin-top: 20px;">Loading Data...</div>

    <script>
        async function fetchMarket() {
            try {
                const res = await fetch('market_scan.json?t=' + Date.now());
                const json = await res.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';

                Object.keys(json.data).forEach(key => {
                    const d = json.data[key];
                    const color = d.score >= 70 ? 'var(--green)' : d.score >= 40 ? 'var(--blue)' : 'var(--red)';
                    
                    grid.innerHTML += `
                        <div class="card">
                            <div style="font-size:12px; color:#8b949e;">${key}</div>
                            <div class="price">₹${d.price}</div>
                            <span class="signal-tag" style="background:${color}22; color:${color}">${d.signal}</span>
                            <div class="score-bar"><div class="score-fill" style="width:${d.score}%; background:${color}"></div></div>
                        </div>`;
                });
                document.getElementById('time').innerText = "Last Update: " + json.last_update;
            } catch (e) { document.getElementById('time').innerText = "Waiting for JSON file..."; }
        }
        setInterval(fetchMarket, 30000);
        fetchMarket();
    </script>
</body>
</html>
