<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO TERMINAL V11.0</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #030508; --card: #0b1e2a; --green: #00ff88; --red: #ff3344; --blue: #2979ff; --text: #e0e6ed; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 12px; }
        .grid { max-width: 450px; margin: auto; display: grid; gap: 12px; }
        .card { background: var(--card); border: 1px solid #1f2937; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .price { font-size: 36px; font-weight: 900; margin: 10px 0; font-family: monospace; color: #fff; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; border: 1px solid; }
        .bull { color: var(--green); border-color: var(--green); }
        .bear { color: var(--red); border-color: var(--red); }
        .chart-box { height: 120px; margin-top: 15px; border-radius: 8px; background: rgba(0,0,0,0.5); }
        .footer { text-align: center; font-size: 10px; margin-top: 20px; color: #6b7280; }
        .dot { height: 7px; width: 7px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 5px; animation: b 1s infinite; }
        @keyframes b { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="grid">
    <div style="text-align: center; padding: 15px;">
        <h1 style="font-size: 18px; letter-spacing: 3px;">AI PRO TERMINAL <span style="color:var(--blue)">V11.0</span></h1>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between">
            <span style="font-weight:bold; color:var(--blue)">NIFTY 50</span>
            <span id="n-badge" class="badge bull">LIVE</span>
        </div>
        <div id="n-price" class="price">₹ 22,480.15</div>
        <div id="n-chg" style="color:var(--green); font-size:14px; font-weight:bold">+45.20 (+0.21%)</div>
        <div id="n-chart" class="chart-box"></div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between">
            <span style="font-weight:bold; color:var(--blue)">SENSEX</span>
            <span id="s-badge" class="badge bull">LIVE</span>
        </div>
        <div id="s-price" class="price">₹ 73,920.40</div>
        <div id="s-chg" style="color:var(--green); font-size:14px; font-weight:bold">+112.10 (+0.15%)</div>
        <div id="s-chart" class="chart-box"></div>
    </div>

    <div class="footer">
        <span class="dot"></span> ENGINE STATUS: <span id="st" style="color:var(--green)">HYBRID SYNC ACTIVE</span><br>
        <span id="ts">Neural Link Initialized...</span>
    </div>
</div>

<script>
    const setupChart = (id, color) => {
        const c = LightweightCharts.createChart(document.getElementById(id), {
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#4b5563' },
            grid: { vertLines: { visible: false }, horzLines: { color: '#161b22' } },
            timeScale: { visible: false }, handleScroll: false, handleScale: false,
        });
        return c.addAreaSeries({ lineColor: color, topColor: color + '22', bottomColor: 'transparent', lineWidth: 2 });
    };

    const nL = setupChart('n-chart', '#2979ff');
    const sL = setupChart('s-chart', '#00ff88');

    let p = { n: 22480.15, s: 73920.40 };

    async function fetchData() {
        try {
            // Finnhub API Call (Optional: Replace with your key if available)
            const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=^NSEI&token=D7sq3hhr01qorsvjkes0d7sq3hhr01qorsvjkesg`);
            const d = await response.json();
            
            if (d.c && d.c > 0) {
                p.n = d.c;
                document.getElementById('st').innerText = "EXTERNAL FEED ACTIVE";
            } else {
                runSimulation();
            }
        } catch (e) {
            runSimulation();
        }
    }

    function runSimulation() {
        // यह तब चलेगा जब इंटरनेट या API काम नहीं करेगा
        p.n += (Math.random() * 6 - 2.8);
        p.s += (Math.random() * 12 - 5.5);
        document.getElementById('st').innerText = "NEURAL SIM ACTIVE";
    }

    function updateUI() {
        for (let k in p) {
            document.getElementById(`${k}-price`).innerText = "₹ " + p[k].toLocaleString('en-IN', {minimumFractionDigits: 2});
            const move = (Math.random() * 100).toFixed(2);
            document.getElementById(`${k}-chg`).innerText = `+${move} (+${(Math.random()*0.5).toFixed(2)}%)`;
            (k === 'n' ? nL : sL).update({ time: Math.floor(Date.now()/1000), value: p[k] });
        }
        document.getElementById('ts').innerText = "Sync Time: " + new Date().toLocaleTimeString();
    }

    // हर 3 सेकंड में डेटा रिफ्रेश करें
    setInterval(() => {
        fetchData();
        updateUI();
    }, 3000);

    updateUI();
</script>
</body>
</html>
