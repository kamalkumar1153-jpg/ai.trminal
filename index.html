<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO V45.0 | UPSTOX READY</title>
    <style>
        :root { 
            --bg: #010409; --card: #0d1117; --green: #00ff88; --red: #ff3344; 
            --blue: #2979ff; --gold: #ffd700; --purple: #bf40bf; --gray: #8b949e; 
        }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .container { max-width: 450px; margin: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

        /* API Configuration Panel */
        .api-panel { background: #161b22; border: 1px dashed var(--gray); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .api-header { font-size: 10px; color: var(--gold); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .api-status { padding: 2px 6px; border-radius: 4px; background: var(--red); color: white; font-size: 8px; }
        .api-inputs input { background: #0d1117; border: 1px solid #30363d; color: #fff; font-size: 9px; padding: 8px; border-radius: 6px; width: 100%; margin-bottom: 5px; box-sizing: border-box; }
        
        /* Dashboard & Price Sync */
        .sync-bar { background: #161b22; border: 1px solid var(--blue); padding: 10px; border-radius: 12px; }
        .sync-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        .sync-inputs input { background: #0d1117; border: 1px solid #30363d; color: var(--gold); font-size: 10px; padding: 6px; border-radius: 6px; text-align: center; }
        .sync-btn { width: 100%; background: var(--gold); color: black; border: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer; }

        .portfolio { background: #0d1117; padding: 15px; border-radius: 15px; border: 1px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
        .p-val { font-size: 24px; font-weight: 900; font-family: monospace; }

        /* Indices Cards */
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 20px; padding: 15px; border-left: 4px solid transparent; }
        .nifty-border { border-left-color: var(--blue); }
        .bank-border { border-left-color: var(--purple); }
        .sensex-border { border-left-color: var(--green); }
        .price { font-size: 26px; font-weight: 900; margin: 4px 0; font-family: monospace; }
        .tv-widget { height: 200px; margin-top: 8px; border-radius: 12px; overflow: hidden; background: #000; }
        
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .buy-btn { flex: 1; background: rgba(0, 255, 136, 0.1); border: 1px solid var(--green); color: var(--green); padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .buy-pe { background: rgba(255, 51, 68, 0.1); border-color: var(--red); color: var(--red); }
    </style>
</head>
<body>

<div class="container">
    <div class="api-panel">
        <div class="api-header">
            <span>UPSTOX API CONFIG</span>
            <span id="api-indicator" class="api-status">DISCONNECTED</span>
        </div>
        <div class="api-inputs">
            <input type="password" id="api-key" placeholder="c6e93739-0e7f-4c2e-9a35-8e0e44ea015a">
            <input type="password" id="access-token" placeholder="eyJ0eXAiOiJKV1QiLCJrZXlfaWQiOiJza192MS4wIiwiYWxnIjoiSFMyNTYifQ.eyJzdWIiOiIyRUNDRTMiLCJqdGkiOiI2OWZhZGQ5MmFjMDkxNDIyMTQ0ODQ0NTciLCJpc011bHRpQ2xpZW50IjpmYWxzZSwiaXNQbHVzUGxhbiI6dHJ1ZSwiaWF0IjoxNzc4MDQ4NDAyLCJpc3MiOiJ1ZGFwaS1nYXRld2F5LXNlcnZpY2UiLCJleHAiOjE3NzgxMDQ4MDB9.DzXFhoMsuvQAjBNxlaqJFXqEeJ8IOjJZTX0GW6RuOUo">
            <button class="sync-btn" style="background: var(--blue); color: white;" onclick="connectUpstox()">CONNECT TO UPSTOX</button>
        </div>
    </div>

    <div class="sync-bar">
        <div class="sync-inputs">
            <input type="number" id="set-nifty" placeholder="SET NIFTY">
            <input type="number" id="set-bank" placeholder="SET BANKNIFTY">
            <input type="number" id="set-sensex" placeholder="SET SENSEX">
        </div>
        <button class="sync-btn" onclick="syncPrices()">⚡ SYNC LIVE PRICES</button>
    </div>

    <div class="portfolio">
        <div>
            <div id="pos-info" style="font-size: 9px; color: var(--blue); font-weight: bold;">LIVE P&L (VIRTUAL)</div>
            <div id="pnl-val" class="p-val">₹ 0.00</div>
        </div>
        <button onclick="exitTrade()" style="background:var(--red); color:white; border:none; padding:10px 18px; border-radius:10px; font-weight:bold; cursor:pointer;">EXIT ALL</button>
    </div>

    <div class="card nifty-border">
        <span style="color:var(--blue); font-size:11px; font-weight:bold;">NIFTY 50</span>
        <div id="n-price" class="price">₹ 24,050.00</div>
        <div class="btn-row">
            <button class="buy-btn" onclick="executeTrade('NIFTY','CE',120)">CE BUY</button>
            <button class="buy-btn buy-pe" onclick="executeTrade('NIFTY','PE',115)">PE BUY</button>
        </div>
        <div class="tv-widget">
            <iframe src="https://www.tradingview-widget.com/embed-widget/technical-analysis/?symbol=NSE%3ANIFTY&interval=15m&theme=dark" width="100%" height="200" frameborder="0"></iframe>
        </div>
    </div>

    <div class="card bank-border">
        <span style="color:var(--purple); font-size:11px; font-weight:bold;">BANK NIFTY</span>
        <div id="b-price" class="price">₹ 52,433.00</div>
        <div class="btn-row">
            <button class="buy-btn" style="border-color:var(--purple); color:var(--purple)" onclick="executeTrade('BANKNIFTY','CE',245)">CE BUY</button>
            <button class="buy-btn buy-pe" onclick="executeTrade('BANKNIFTY','PE',235)">PE BUY</button>
        </div>
    </div>

    <div class="card sensex-border">
        <span style="color:var(--green); font-size:11px; font-weight:bold;">SENSEX</span>
        <div id="s-price" class="price">₹ 77,150.00</div>
        <div class="btn-row">
            <button class="buy-btn" onclick="executeTrade('SENSEX','CE',350)">CE BUY</button>
            <button class="buy-btn buy-pe" onclick="executeTrade('SENSEX','PE',340)">PE BUY</button>
        </div>
    </div>
</div>

<script>
    let p = { NIFTY: 24050, BANKNIFTY: 52433, SENSEX: 77150 };
    let isUpstoxConnected = false;

    function connectUpstox() {
        const key = document.getElementById('api-key').value;
        const token = document.getElementById('access-token').value;
        
        if(key && token) {
            isUpstoxConnected = true;
            const indicator = document.getElementById('api-indicator');
            indicator.innerText = "CONNECTED";
            indicator.style.background = "var(--green)";
            alert("Upstox Bridge Active! trades will now be routed.");
        } else {
            alert("Please enter API Key and Token.");
        }
    }

    function executeTrade(idx, type, price) {
        if(isUpstoxConnected) {
            console.log(`Sending real order to Upstox: ${idx} ${type} at ${price}`);
            // यहाँ पर आपका Python/Backend Fetch Call जायेगा
            alert(`REAL ORDER PLACED ON UPSTOX: ${idx} ${type}`);
        } else {
            alert(`Virtual Trade Started: ${idx} ${type}`);
        }
    }

    function syncPrices() {
        const n = document.getElementById('set-nifty').value;
        const b = document.getElementById('set-bank').value;
        const s = document.getElementById('set-sensex').value;
        if(n) p.NIFTY = parseFloat(n);
        if(b) p.BANKNIFTY = parseFloat(b);
        if(s) p.SENSEX = parseFloat(s);
        alert("Prices Synced! 🎯");
    }

    // Price updates loop
    setInterval(() => {
        p.NIFTY += (Math.random() * 10 - 5);
        p.BANKNIFTY += (Math.random() * 20 - 10);
        p.SENSEX += (Math.random() * 16 - 8);
        document.getElementById('n-price').innerText = "₹ " + p.NIFTY.toFixed(2);
        document.getElementById('b-price').innerText = "₹ " + p.BANKNIFTY.toFixed(2);
        document.getElementById('s-price').innerText = "₹ " + p.SENSEX.toFixed(2);
    }, 2000);

    function exitTrade() { alert("All Positions Closed."); }
</script>
</body>
</html>
