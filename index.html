<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO TERMINAL V40.0</title>
    <style>
        :root { 
            --bg: #010409; --card: #0d1117; --green: #00ff88; --red: #ff3344; 
            --blue: #2979ff; --gold: #ffd700; --purple: #bf40bf; --gray: #8b949e; 
        }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        
        .ticker-wrap { background: #161b22; color: var(--gold); padding: 6px 0; font-size: 10px; border-bottom: 1px solid #30363d; overflow: hidden; white-space: nowrap; }
        .ticker { display: inline-block; animation: scroll 30s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .container { max-width: 450px; margin: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Price Sync Tool */
        .sync-bar { background: #161b22; border: 1px solid var(--blue); padding: 10px; border-radius: 12px; }
        .sync-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .sync-inputs input { background: #0d1117; border: 1px solid #30363d; color: var(--gold); font-size: 11px; padding: 6px; border-radius: 6px; text-align: center; width: 100%; box-sizing: border-box; }
        .sync-btn { width: 100%; background: var(--gold); color: black; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; }

        /* P&L Dashboard */
        .portfolio { background: linear-gradient(145deg, #161b22, #0d1117); padding: 15px; border-radius: 16px; border: 1px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
        .p-val { font-size: 26px; font-weight: 900; font-family: monospace; }
        
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 20px; padding: 15px; border-left: 4px solid transparent; margin-bottom: 10px; }
        .nifty-border { border-left-color: var(--blue); }
        .bank-border { border-left-color: var(--purple); }
        .sensex-border { border-left-color: var(--green); }
        .gift-border { border-left-color: var(--gold); }

        .price { font-size: 28px; font-weight: 900; margin: 5px 0; font-family: monospace; }
        .tv-widget { height: 230px; margin-top: 10px; border-radius: 12px; overflow: hidden; border: 1px solid #21262d; }

        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .buy-btn { flex: 1; background: none; border: 1px solid var(--green); color: var(--green); padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .buy-pe { border-color: var(--red); color: var(--red); }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker">⚙️ AI PRO V40.0: GIFT NIFTY | NIFTY | BANK NIFTY | SENSEX | 15m GAUGE SYNCED...</div>
</div>

<div class="container">
    <div class="sync-bar">
        <div class="sync-inputs">
            <input type="number" id="set-gift" placeholder="SET GIFT (24173)">
            <input type="number" id="set-nifty" placeholder="SET NIFTY">
            <input type="number" id="set-bank" placeholder="SET BANKNIFTY">
            <input type="number" id="set-sensex" placeholder="SET SENSEX">
        </div>
        <button class="sync-btn" onclick="syncPrices()">⚡ SYNC NOW</button>
    </div>

    <div class="portfolio" id="main-dash">
        <div>
            <div style="font-size: 10px; color: var(--blue); font-weight: bold;">LIVE P&L (VIRTUAL)</div>
            <div id="pnl-val" class="p-val">₹ 0.00</div>
            <div id="pos-info" style="font-size: 9px; color: var(--gray);">WAITING...</div>
        </div>
        <button onclick="exitTrade()" style="background:var(--red); color:white; border:none; padding:10px 18px; border-radius:10px; font-weight:bold;">EXIT ALL</button>
    </div>

    <div class="card gift-border">
        <span style="color:var(--gold); font-size:11px; font-weight:bold;">GIFT NIFTY</span>
        <div id="g-price" class="price" style="color:var(--gold)">₹ 24,173.00</div>
        <div class="tv-widget">
            <iframe src="https://www.tradingview-widget.com/embed-widget/technical-analysis/?symbol=NSEIX%3ANIFTY1!&interval=15m&isTransparent=true&displayMode=single&locale=in&theme=dark" width="100%" height="230" frameborder="0"></iframe>
        </div>
    </div>

    <div class="card nifty-border">
        <span style="color:var(--blue); font-size:11px; font-weight:bold;">NIFTY 50 (65 Lot)</span>
        <div id="n-price" class="price">₹ 24,050.00</div>
        <div class="btn-row">
            <button class="buy-btn" onclick="buy('NIFTY','CE',24100,120)">CE BUY</button>
            <button class="buy-btn buy-pe" onclick="buy('NIFTY','PE',24100,115)">PE BUY</button>
        </div>
        <div class="tv-widget">
            <iframe src="https://www.tradingview-widget.com/embed-widget/technical-analysis/?symbol=NSE%3ANIFTY&interval=15m&isTransparent=true&displayMode=single&locale=in&theme=dark" width="100%" height="230" frameborder="0"></iframe>
        </div>
    </div>

    <div class="card bank-border">
        <span style="color:var(--purple); font-size:11px; font-weight:bold;">BANK NIFTY (30 Lot)</span>
        <div id="b-price" class="price">₹ 52,433.00</div>
        <div class="btn-row">
            <button class="buy-btn" onclick="buy('BANKNIFTY','CE',52500,245)" style="border-color:var(--purple); color:var(--purple)">CE BUY</button>
            <button class="buy-btn buy-pe" onclick="buy('BANKNIFTY','PE',52500,235)">PE BUY</button>
        </div>
        <div class="tv-widget">
            <iframe src="https://www.tradingview-widget.com/embed-widget/technical-analysis/?symbol=NSE%3ABANKNIFTY&interval=15m&isTransparent=true&displayMode=single&locale=in&theme=dark" width="100%" height="230" frameborder="0"></iframe>
        </div>
    </div>

    <div class="card sensex-border">
        <span style="color:var(--green); font-size:11px; font-weight:bold;">SENSEX (20 Lot)</span>
        <div id="s-price" class="price">₹ 77,075.00</div>
        <div class="btn-row">
            <button class="buy-btn" onclick="buy('SENSEX','CE',77100,350)">CE BUY</button>
            <button class="buy-btn buy-pe" onclick="buy('SENSEX','PE',77100,340)">PE BUY</button>
        </div>
        <div class="tv-widget">
            <iframe src="https://www.tradingview-widget.com/embed-widget/technical-analysis/?symbol=BSE%3ASENSEX&interval=15m&isTransparent=true&displayMode=single&locale=in&theme=dark" width="100%" height="230" frameborder="0"></iframe>
        </div>
    </div>
</div>

<script>
    const LOTS = { NIFTY: 65, BANKNIFTY: 30, SENSEX: 20 };
    let p = { GIFT: 24173.00, NIFTY: 24050.00, BANKNIFTY: 52433.00, SENSEX: 77075.00 };
    let activeTrade = null;

    function syncPrices() {
        const g = document.getElementById('set-gift').value;
        const n = document.getElementById('set-nifty').value;
        const b = document.getElementById('set-bank').value;
        const s = document.getElementById('set-sensex').value;
        if(g) p.GIFT = parseFloat(g);
        if(n) p.NIFTY = parseFloat(n);
        if(b) p.BANKNIFTY = parseFloat(b);
        if(s) p.SENSEX = parseFloat(s);
        alert("Prices Synced! 🎯");
    }

    function update() {
        setInterval(() => {
            p.GIFT += (Math.random()*4-2); p.NIFTY += (Math.random()*6-3); 
            p.BANKNIFTY += (Math.random()*15-7); p.SENSEX += (Math.random()*12-6);
            document.getElementById('g-price').innerText = "₹ " + p.GIFT.toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.getElementById('n-price').innerText = "₹ " + p.NIFTY.toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.getElementById('b-price').innerText = "₹ " + p.BANKNIFTY.toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.getElementById('s-price').innerText = "₹ " + p.SENSEX.toLocaleString('en-IN', {minimumFractionDigits: 2});
            if(activeTrade) calculatePnL();
        }, 3000);
    }

    function buy(idx, type, strike, price) {
        activeTrade = { idx, type, strike, entry: parseFloat(price), lot: LOTS[idx] };
        document.getElementById('pos-info').innerText = `ACTIVE: ${idx} ${type} @ ${price}`;
        document.getElementById('pos-info').style.color = "var(--gold)";
    }

    function calculatePnL() {
        const currentPrice = activeTrade.entry + (Math.random()*10-5);
        const pnl = (currentPrice - activeTrade.entry) * activeTrade.lot;
        const pnlEl = document.getElementById('pnl-val');
        pnlEl.innerText = "₹ " + pnl.toFixed(2);
        pnlEl.style.color = pnl >= 0 ? "var(--green)" : "var(--red)";
    }

    function exitTrade() {
        activeTrade = null;
        document.getElementById('pnl-val').innerText = "₹ 0.00";
        document.getElementById('pnl-val').style.color = "#fff";
        document.getElementById('pos-info').innerText = "CLOSED";
    }

    update();
</script>
</body>
</html>
