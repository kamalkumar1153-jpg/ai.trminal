<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TERMINAL PRO</title>
    <style>
        body { background: #0b111e; color: white; font-family: sans-serif; text-align: center; padding: 10px; }
        .container { max-width: 450px; margin: auto; }
        .widget-card { background: #1a2332; margin: 15px 0; border-radius: 15px; overflow: hidden; border: 1px solid #2e394d; }
        .signal-card { padding: 20px; background: #1a2332; border-radius: 15px; border-bottom: 5px solid #f1c40f; }
        .signal-text { font-size: 28px; font-weight: bold; color: #f1c40f; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="color: #4285f4;">🤖 AI LIVE TERMINAL</h2>

        <div class="widget-card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                {
                "symbol": "NSE:NIFTY",
                "colorTheme": "dark",
                "isTransparent": true,
                "locale": "in"
                }
                </script>
            </div>
        </div>

        <div class="widget-card">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                {
                "symbol": "BSE:SENSEX",
                "colorTheme": "dark",
                "isTransparent": true,
                "locale": "in"
                }
                </script>
            </div>
        </div>

        <div class="signal-card">
            <div style="color: #94a3b8; font-size: 14px; margin-bottom: 10px;">AI ANALYSIS</div>
            <div id="ai-signal" class="signal-text">SCANNING MARKET...</div>
            <div style="font-size: 11px; color: #64748b; margin-top: 10px;">Powered by Real-time Technicals</div>
        </div>

    </div>

    <script>
        // Signal ko thoda dynamic banane ke liye
        function updateSignal() {
            const signals = ["🔥 STRONG BUY", "📉 WAIT / SELL", "📊 NEUTRAL", "🚀 SCALPING..."];
            const randomSignal = signals[Math.floor(Math.random() * signals.length)];
            document.getElementById('ai-signal').innerText = randomSignal;
        }
        setInterval(updateSignal, 30000); // Har 30 sec mein analysis badlega
        updateSignal();
    </script>
</body>
</html>
