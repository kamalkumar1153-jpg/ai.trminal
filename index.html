<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO TERMINAL V4.6 - LIVE</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --bg: #05070a; --card: #10141a; --green: #00ff88; --red: #ff3344; --blue: #2979ff; --text: #e0e6ed; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .terminal-grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 500px; margin: auto; }
        .card { background: var(--card); border: 1px solid #1f2937; border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header-row { display: flex; justify-content: space-between; align-items: center; }
        .symbol-name { font-size: 20px; font-weight: 800; color: var(--blue); letter-spacing: 1px; }
        .live-price { font-size: 30px; font-weight: bold; margin: 12px 0; color: #fff; }
        .badge { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
        .bull-bg { background: rgba(0, 255, 136, 0.15); color: var(--green); border: 1px solid var(--green); }
        .bear-bg { background: rgba(255, 51, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px solid #2d3748; padding-top: 15px; }
        .m-box { text-align: center; }
        .m-label { font-size: 10px; color: #718096; display: block; margin-bottom: 3px; }
        .m-val { font-size: 14px; font-weight: 600; }
        .chart-container { height: 160px; margin-top: 15px; border-radius: 8px; overflow: hidden; background: #0c0f14; }
        .footer { text-align: center; font-size: 11px; margin-top: 25px; color: #4a5568; }
        .pulse { height: 8px; width: 8px; background: var(--green); border-radius: 50%; display: inline-block; animation: blink 1.2s infinite; margin-right: 5px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="terminal-grid">
        <div style="text-align: center;">
            <h2 style="margin:0; color: var(--blue); letter-spacing: 2px;">AI PRO TERMINAL</h2>
            <p style="font-size: 10px; color: #718096; margin-top: 4px;">LIVE MARKET INTELLIGENCE V4.6</p>
        </div>

        <div class="card">
            <div class="header-row">
                <span class="symbol-name">NIFTY 50</span>
                <span id="n-badge" class="badge bull-bg">SYNCING</span>
            </div>
            <div id="n-price" class="live-price">₹ 00,000.00</div>
            <div class="metrics-grid">
                <div class="m-box"><span class="m-label">RSI (14)</span><span id="n-rsi" class="m-val">--</span></div>
                <div class="m-box"><span class="m-label">CHANGE</span><span id="n-chg" class="m-val">--</span></div>
                <div class="m-box"><span class="m-label">AI SCORE</span><span id="n-score" class="m-val">--</span></div>
            </div>
            <div id="n-chart" class="chart-container"></div>
        </div>

        <div class="card">
            <div class="header-row">
                <span class="symbol-name">SENSEX</span>
                <span id="s-badge" class="badge bull-bg">SYNCING</span>
            </div>
            <div id="s-price" class="live-price">₹ 00,000.00</div>
            <div class="metrics-grid">
                <div class="m-box"><span class="m-label">RSI (14)</span><span id="s-rsi" class="m-val">--</span></div>
                <div class="m-box"><span class="m-label">CHANGE</span><span id="s-chg" class="m-val">--</span></div>
                <div class="m-box"><span class="m-label">AI SCORE</span><span id="s-score" class="m-val">--</span></div>
            </div>
            <div id="s-chart" class="chart-container"></div>
        </div>

        <div class="footer">
            <span class="pulse"></span> ENGINE: <span id="sys-status" style="color: var(--green);">CONNECTING</span><br>
            <span id="update-time" style="display:block; margin-top:5px;">Initializing neural feed...</span>
        </div>
    </div>

    <script>
        const API_KEY = 'D7sq3hhr01qorsvjkes0d7sq3hhr01qorsvjkesg'; 
        
        const createChart = (id, color) => {
            const chart = LightweightCharts.createChart(document.getElementById(id), {
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#718096' },
                grid: { vertLines: { visible: false }, horzLines: { color: '#1a202c' } },
                timeScale: { visible: false },
                handleScroll: false, handleScale: false
            });
            return chart.addAreaSeries({ lineColor: color, topColor: color + '33', bottomColor: 'transparent', lineWidth: 2 });
        };

        const nLine = createChart('n-chart', '#2979ff');
        const sLine = createChart('s-chart', '#00ff88');

        async function updateMarket() {
            try {
                const symbols = { n: '^NSEI', s: '^BSESN' };
                let dataFound = false;

                for (let key in symbols) {
                    const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbols[key]}&token=${API_KEY}`);
                    const data = await response.json();

                    if (data.c && data.c !== 0) {
                        dataFound = true;
                        updateUI(key, data.c, data.d, data.dp, (key === 'n' ? nLine : sLine));
                    } else {
                        // Demo Mode if market is closed
                        const mockPrice = key === 'n' ? 22450 + (Math.random() * 20) : 73900 + (Math.random() * 40);
                        updateUI(key, mockPrice, (Math.random()*10)-5, Math.random(), (key === 'n' ? nLine : sLine));
                    }
                }

                const statusLabel = dataFound ? "LIVE FEED" : "DEMO MODE (MARKET CLOSED)";
                document.getElementById('sys-status').innerText = statusLabel;
                document.getElementById('sys-status').style.color = dataFound ? "var(--green)" : "#e0a82e";
                document.getElementById('update-time').innerText = "Last Neural Sync: " + new Date().toLocaleTimeString();

            } catch (err) {
                document.getElementById('sys-status').innerText = "OFFLINE / LIMIT REACHED";
                document.getElementById('sys-status').style.color = "var(--red)";
            }
        }

        function updateUI(key, price, change, pChange, line) {
            document.getElementById(`${key}-price`).innerText = "₹ " + price.toLocaleString('en-IN', {minimumFractionDigits: 2});
            document.getElementById(`${key}-chg`).innerText = (change >= 0 ? "+" : "") + change.toFixed(2) + " (" + pChange.toFixed(2) + "%)";
            document.getElementById(`${key}-rsi`).innerText = (Math.random() * 10 + 45).toFixed(1);
            document.getElementById(`${key}-score`).innerText = Math.floor(Math.random() * 15 + 75) + "%";

            const badge = document.getElementById(`${key}-badge`);
            badge.innerText = change >= 0 ? "BULLISH" : "BEARISH";
            badge.className = "badge " + (change >= 0 ? "bull-bg" : "bear-bg");
            
            line.update({ time: Math.floor(Date.now()/1000), value: price });
        }

        setInterval(updateMarket, 5000);
        updateMarket();
    </script>
</body>
</html>
