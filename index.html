<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO EXPERT TERMINAL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header { margin-bottom: 30px; }
        .rocket { font-size: 40px; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; }
        .label { font-size: 14px; color: #94a3b8; text-transform: uppercase; }
        .price { font-size: 24px; font-weight: bold; margin-top: 10px; color: #2ecc71; }
        
        .signal-box { 
            background: #1e293b; border: 2px dashed #475569; padding: 30px; 
            border-radius: 15px; margin: 20px 0; font-size: 22px; font-weight: 800;
            color: #f1f5f9; min-height: 50px; display: flex; align-items: center; justify-content: center;
        }
        
        .btn-activate {
            background-color: #059669; color: white; border: none; padding: 18px 30px;
            font-size: 18px; border-radius: 12px; font-weight: bold; cursor: pointer;
            width: 100%; transition: 0.3s; box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4);
        }
        .btn-activate:active { transform: scale(0.98); }
        
        .sync-info { font-size: 12px; color: #64748b; margin-top: 20px; }
        .buy-signal { color: #2ecc71 !important; border-color: #2ecc71 !important; }
        .sell-signal { color: #ef4444 !important; border-color: #ef4444 !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="rocket">🚀</div>
        <h1 style="margin: 5px 0; font-size: 24px;">AI PRO EXPERT TERMINAL</h1>
        <p style="color: #64748b; font-size: 14px;">Live Data Sync: <span id="sync-status">Connected</span></p>
    </div>

    <div class="grid-container">
        <div class="card">
            <div class="label">NIFTY 50</div>
            <div id="nifty-price" class="price">0.00</div>
        </div>
        <div class="card">
            <div class="label">SENSEX</div>
            <div id="sensex-price" class="price">0.00</div>
        </div>
    </div>

    <div id="signal-display" class="signal-box">
        WAITING FOR DATA...
    </div>

    <button id="activateBtn" class="btn-activate">
        ACTIVATE TERMINAL (VOICE ON)
    </button>

    <div class="sync-info">
        Last Sync: <span id="last-sync">--:--:--</span>
    </div>

    <script>
        // --- APNI FIREBASE CONFIG YAHAN DAALEIN ---
        const firebaseConfig = {
            databaseURL: "https://ai-pro-terminal-default-rtdb.us-central1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let lastSpokenSignal = "";

        // Voice Function
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Purani awaaz roko
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-IN'; 
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);
            }
        }

        // Button Click to enable Voice
        const activateBtn = document.getElementById('activateBtn');
        activateBtn.addEventListener('click', () => {
            speak("Terminal Activated. AI Pro is watching the market.");
            activateBtn.innerText = "TERMINAL ACTIVE 🔊";
            activateBtn.style.backgroundColor = "#047857";
        });

        // Firebase Data Listener
        db.ref("market_data").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Prices Update
                document.getElementById('nifty-price').innerText = data.nifty || "0.00";
                document.getElementById('sensex-price').innerText = data.sensex || "0.00";
                document.getElementById('last-sync').innerText = data.last_sync || "--:--:--";

                // Signal Update
                const signalText = data.signal || "WAITING...";
                const signalBox = document.getElementById('signal-display');
                signalBox.innerText = signalText;

                // Style & Voice Logic
                if (signalText.includes("BUY")) {
                    signalBox.className = "signal-box buy-signal";
                    if(lastSpokenSignal !== signalText) {
                        speak("Buy Signal Detected. Trend is Up.");
                        lastSpokenSignal = signalText;
                    }
                } else if (signalText.includes("SELL")) {
                    signalBox.className = "signal-box sell-signal";
                    if(lastSpokenSignal !== signalText) {
                        speak("Sell Signal Detected. Trend is Down.");
                        lastSpokenSignal = signalText;
                    }
                } else {
                    signalBox.className = "signal-box";
                }
            }
        }, (error) => {
            console.error("Firebase Error: ", error);
            document.getElementById('sync-status').innerText = "Disconnected";
        });
    </script>
</body>
</html>
