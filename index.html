<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Expert - Kamal Trader</title>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 450px; margin: auto; background: #161b22; padding: 15px; border-radius: 20px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .market-card { background: #21262d; padding: 10px; border-radius: 12px; border-left: 5px solid #58a6ff; text-align: left; margin-bottom: 10px; }
        .price { font-size: 18px; font-weight: bold; color: #3fb950; display: block; }
        #main-signal { font-size: 20px; font-weight: 900; margin: 15px 0; padding: 15px; background: #21262d; border-radius: 12px; border: 2px dashed #444; }
        input { width: 80%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; margin-bottom: 10px; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 85%; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="color: #58a6ff; margin-bottom: 15px;">🚀 AI PRO EXPERT TERMINAL</h3>
    
    <div class="market-card">
        <span>NIFTY 50</span>
        <span id="nifty-price" class="price">Connecting...</span>
    </div>

    <div id="main-signal">WAITING FOR DATA</div>

    <div class="token-box">
        <input type="password" id="token-input" placeholder="Upstox Access Token">
        <button onclick="saveToken()">CONNECT TERMINAL</button>
    </div>

    <div id="update-time" style="font-size: 12px; color: #8b949e; margin-top: 15px;">Pushbullet Alerts: Active ✅</div>
</div>

<script>
    const BRIDGE_URL = "https://ai-trminal.onrender.com/market-data";
    const PB_TOKEN = "o.z1IwRMfQ6CZJW3E88n56DQMLhqZJyhbV"; // Aapka Token yahan set kar diya hai
    let lastSignal = "";

    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'hi-IN';
        window.speechSynthesis.speak(speech);
    }

    async function sendPush(title, message) {
        try {
            await fetch('https://api.pushbullet.com/v2/pushes', {
                method: 'POST',
                headers: {
                    'Access-Token': PB_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    type: 'note',
                    title: title,
                    body: message
                })
            });
        } catch (e) { console.log("Push Error"); }
    }

    function saveToken() {
        const token = document.getElementById('token-input').value;
        if(token) {
            localStorage.setItem('upstox_token', token);
            speak("टर्मिनल कनेक्ट हो गया है");
            updateTerminal();
        }
    }

    async function updateTerminal() {
        const upstoxToken = localStorage.getItem('upstox_token');
        if(!upstoxToken) return;

        try {
            const res = await fetch(BRIDGE_URL + "?token=" + upstoxToken);
            const responseData = await res.json();
            const nifty = responseData.data["NSE_INDEX:Nifty 50"].last_price;
            document.getElementById('nifty-price').innerText = nifty.toFixed(2);

            const sigEl = document.getElementById('main-signal');

            // Signal Logic (Udaharan ke liye 24000 ka level)
            if (nifty > 24055) {
                sigEl.innerText = "🚀 STRONG BUY";
                sigEl.style.color = "#3fb950";
                if(lastSignal !== "BUY") { 
                    speak("खरीदारी का सिग्नल है"); 
                    sendPush("🚀 AI BUY ALERT", "Nifty Bullish! Trend is UP. Price: " + nifty);
                    lastSignal = "BUY"; 
                }
            } else {
                sigEl.innerText = "🔻 SELL / WAIT";
                sigEl.style.color = "#f85149";
                if(lastSignal !== "SELL") { 
                    speak("बिकवाली का दबाव है"); 
                    sendPush("🔻 AI SELL ALERT", "Nifty Bearish! Trend is DOWN. Price: " + nifty);
                    lastSignal = "SELL"; 
                }
            }
            document.getElementById('update-time').innerText = "Last Sync: " + new Date().toLocaleTimeString();
        } catch (e) { console.log("Error fetching data"); }
    }

    setInterval(updateTerminal, 5000); // Har 5 second mein update
    updateTerminal();
</script>

</body>
</html>
