<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO EXPERT TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .signal-box { border: 2px dashed #30363d; border-radius: 8px; padding: 15px; text-align: center; }
    </style>
</head>
<body class="p-4">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-blue-400">🚀 AI PRO EXPERT TERMINAL</h1>
        <p class="text-xs text-gray-500">Live Data Sync: Enabled</p>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="card p-4">
            <p class="text-sm text-gray-400">NIFTY 50</p>
            <h2 id="nifty-price" class="text-xl font-bold text-green-400">0.00</h2>
        </div>
        <div class="card p-4">
            <p class="text-sm text-gray-400">SENSEX</p>
            <h2 id="sensex-price" class="text-xl font-bold text-green-400">0.00</h2>
        </div>
    </div>

    <div class="signal-box mb-6">
        <h3 id="main-signal" class="text-lg font-black tracking-widest text-gray-400">WAITING FOR DATA...</h3>
    </div>

    <button onclick="activateTerminal()" class="w-full py-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg transition-all shadow-lg">
        ACTIVATE TERMINAL (VOICE ON)
    </button>

    <p class="text-center text-[10px] text-gray-600 mt-4" id="sync-time">Last Sync: --:--:--</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCI3Ovxpev0wIUw9mt95_7AWf8-LP1TwAk",
            authDomain: "ai-pro-terminal.firebaseapp.com",
            databaseURL: https://ai-pro-terminal-default-rtdb.firebaseio.com/
            projectId: "ai-pro-terminal",
            storageBucket: "ai-pro-terminal.firebasestorage.app",
            messagingSenderId: "802644474287",
            appId: "1:802644474287:web:ae40f8ce6550684fce175a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const marketRef = ref(db, 'market_data');

        function speak(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'hi-IN';
            window.speechSynthesis.speak(speech);
        }

        window.activateTerminal = () => {
            speak("टर्मिनल सक्रिय हो गया है। लाइव डेटा का इंतज़ार है।");
        };

        onValue(marketRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('nifty-price').innerText = data.nifty.toLocaleString('en-IN');
                document.getElementById('sensex-price').innerText = data.sensex.toLocaleString('en-IN');
                document.getElementById('sync-time').innerText = `Last Sync: ${data.timestamp}`;
                document.getElementById('main-signal').innerText = "🔥 TERMINAL IS LIVE";
                document.getElementById('main-signal').className = "text-lg font-black tracking-widest text-green-500";
            }
        });
    </script>
</body>
</html>
