<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Terminal v3 - Live</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --green: #3fb950; --blue: #58a6ff; --red: #f85149; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: auto; }
        .header { text-align: center; color: var(--blue); margin-bottom: 25px; }
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .label { font-size: 13px; color: #8b949e; font-weight: bold; text-transform: uppercase; }
        .price { font-size: 32px; font-weight: bold; color: var(--green); margin: 10px 0; }
        .status-btn { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--blue); background: rgba(88,166,255,0.05); color: var(--blue); font-weight: bold; margin-top: 15px; text-align: center; }
        .BULLISH { border-color: var(--green); color: var(--green); background: rgba(63,185,80,0.1); }
        .BEARISH { border-color: var(--red); color: var(--red); background: rgba(248,81,73,0.1); }
        .stats { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; border-top: 1px solid #21262d; padding-top: 12px; margin-top: 10px; }
        .footer { text-align: center; font-size: 11px; color: #484f58; margin-top: 20px; }
        .live-dot { height: 8px; width: 8px; background: var(--green); border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h3>🚀 AI PRO TERMINAL</h3></div>
        
        <div class="card">
            <div class="label">Nifty 50 (^NSEI)</div>
            <div id="n-price" class="price">Loading...</div>
            <div class="stats">
                <span>RSI: <b id="n-rsi">--</b></span>
                <span>SCORE: <b id="n-score">--</b>%</span>
            </div>
            <div id="n-signal" class="status-btn">SYNCING...</div>
        </div>

        <div class="card">
            <div class="label">Sensex (^BSESN)</div>
            <div id="s-price" class="price">Loading...</div>
            <div class="stats">
                <span>RSI: <b id="s-rsi">--</b></span>
                <span>SCORE: <b id="s-score">--</b>%</span>
            </div>
            <div id="s-signal" class="status-btn">SYNCING...</div>
        </div>

        <div class="footer">
            <span class="live-dot"></span> <span id="status">Direct Market Connection</span>
            <div id="time" style="margin-top:5px;"></div>
        </div>
    </div>

    <script>
        async function getPrice(symbol) {
            try {
                // सीधे Yahoo Finance से डेटा फेच करना (बिना सर्वर के)
                const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`);
                const data = await res.json();
                const meta = data.chart.result[0].meta;
                return {
                    price: meta.regularMarketPrice,
                    prevClose: meta.previousClose
                };
            } catch (e) {
                console.error("Error fetching " + symbol, e);
                return null;
            }
        }

        async function updateTerminal() {
            const niftyData = await getPrice('^NSEI');
            const sensexData = await getPrice('^BSESN');

            const refreshUI = (data, prefix) => {
                if (!data) return;
                
                const priceEl = document.getElementById(`${prefix}-price`);
                const rsiEl = document.getElementById(`${prefix}-rsi`);
                const scoreEl = document.getElementById(`${prefix}-score`);
                const signalEl = document.getElementById(`${prefix}-signal`);

                priceEl.innerText = "₹ " + data.price.toLocaleString('en-IN');
                
                // रीयल-टाइम कैलकुलेशन सिमुलेशन
                const rsi = (Math.random() * (70 - 35) + 35).toFixed(1);
                const score = Math.floor(Math.random() * (90 - 45) + 45);
                
                rsiEl.innerText = rsi;
                scoreEl.innerText = score;

                // सिग्नल लॉजिक
                if (data.price > data.prevClose) {
                    signalEl.innerText = "BULLISH SIGNAL";
                    signalEl.className = "status-btn BULLISH";
                } else {
                    signalEl.innerText = "BEARISH SIGNAL";
                    signalEl.className = "status-btn BEARISH";
                }
            };

            refreshUI(niftyData, 'n');
            refreshUI(sensexData, 's');

            document.getElementById('time').innerText = "Last Sync: " + new Date().toLocaleTimeString();
        }

        // हर 10 सेकंड में अपडेट करें
        setInterval(updateTerminal, 10000);
        updateTerminal();
    </script>
</body>
</html>
