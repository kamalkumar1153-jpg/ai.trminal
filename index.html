<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO EXPERT TERMINAL V2</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { background-color: #0b0f1a; color: #e2e8f0; font-family: 'Inter', sans-serif; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; }
        .header { background: #1e293b; padding: 15px; border-radius: 15px; margin-bottom: 15px; border-bottom: 3px solid #3b82f6; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: #161e2d; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; }
        .label { font-size: 11px; color: #64748b; text-transform: uppercase; }
        .value { font-size: 18px; font-weight: bold; }

        /* Indicators Status Styling */
        .ind-container { display: flex; justify-content: space-around; background: #1e293b; padding: 10px; border-radius: 12px; margin-bottom: 15px; }
        .ind-item { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 5px; background: #0f172a; }
        .bull { color: #22c55e; border: 1px solid #22c55e; }
        .bear { color: #ef4444; border: 1px solid #ef4444; }
        .neutral { color: #94a3b8; border: 1px solid #334155; }

        .signal-box { 
            background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #334155;
            font-size: 22px; font-weight: 900; margin-bottom: 15px;
        }
        
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-voice { background: #10b981; color: white; }
        .btn-login { background: #3b82f6; color: white; }
        
        .buy { color: #22c55e !important; border-color: #22c55e !important; box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }
        .sell { color: #ef4444 !important; border-color: #ef4444 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 style="margin:0; font-size: 20px;">🚀 AI PRO TERMINAL</h1>
            <div id="status" style="font-size:12px; color:#94a3b8;">Connecting...</div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">NIFTY 50</div>
                <div id="nifty" class="value" style="color:#22c55e;">0.00</div>
            </div>
            <div class="card">
                <div class="label">RSI (14)</div>
                <div id="rsi" class="value" style="color:#60a5fa;">--</div>
            </div>
        </div>

        <div class="ind-container">
            <div id="ind-macd" class="ind-item neutral">MACD: --</div>
            <div id="ind-ichi" class="ind-item neutral">ICHI: --</div>
            <div id="ind-trend" class="ind-item neutral">TREND: --</div>
        </div>

        <div id="signal-box" class="signal-box">WAITING FOR DATA...</div>

        <button id="voiceBtn" class="btn btn-voice">🔈 ACTIVATE VOICE ALERTS</button>
        <button onclick="window.location.href='/login'" class="btn btn-login">🔗 RE-CONNECT UPSTOX</button>

        <div style="font-size: 10px; color: #475569; margin-top: 10px;">
            Engine: MACD (12,26,9) | RSI (14) | Ichimoku Cloud (9,26,52)
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://ai-pro-terminal-default-rtdb.us-central1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let lastSignal = "";
        let voiceEnabled = false;

        function speak(text) {
            if (voiceEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'en-IN';
                window.speechSynthesis.speak(msg);
            }
        }

        document.getElementById('voiceBtn').addEventListener('click', function() {
            voiceEnabled = true;
            this.innerHTML = "🔊 VOICE IS ON";
            this.style.background = "#059669";
            speak("Voice system active. Ichimoku and MACD monitoring started.");
        });

        db.ref("market_data").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('nifty').innerText = data.nifty || "0.00";
                document.getElementById('rsi').innerText = data.rsi || "--";
                document.getElementById('status').innerText = data.status || "Connected ✅";
                
                const signalText = data.signal || "WAITING...";
                const signalBox = document.getElementById('signal-box');
                signalBox.innerText = signalText;

                // --- Visual Indicator Logic ---
                const macdEl = document.getElementById('ind-macd');
                const ichiEl = document.getElementById('ind-ichi');

                if (signalText.includes("BUY")) {
                    signalBox.className = "signal-box buy";
                    macdEl.className = "ind-item bull"; macdEl.innerText = "MACD: BUY";
                    ichiEl.className = "ind-item bull"; ichiEl.innerText = "ICHI: ABOVE";
                    if (lastSignal !== signalText) { speak("Strong Buy Signal Detected. All indicators confirmed."); lastSignal = signalText; }
                } else if (signalText.includes("SELL")) {
                    signalBox.className = "signal-box sell";
                    macdEl.className = "ind-item bear"; macdEl.innerText = "MACD: SELL";
                    ichiEl.className = "ind-item bear"; ichiEl.innerText = "ICHI: BELOW";
                    if (lastSignal !== signalText) { speak("Strong Sell Signal Detected. Indicators are Bearish."); lastSignal = signalText; }
                } else {
                    signalBox.className = "signal-box";
                    macdEl.className = "ind-item neutral"; macdEl.innerText = "MACD: WAIT";
                    ichiEl.className = "ind-item neutral"; ichiEl.innerText = "ICHI: CLOUD";
                }
            }
        });
    </script>
</body>
</html>
