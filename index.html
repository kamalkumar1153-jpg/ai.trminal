<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Market Terminal</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --green: #3fb950; --blue: #58a6ff; --red: #f85149; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 15px; position: relative; }
        .price { font-size: 30px; font-weight: bold; color: var(--green); margin: 5px 0; }
        .label { font-size: 12px; color: #8b949e; font-weight: bold; }
        .status-btn { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--blue); background: rgba(88,166,255,0.1); color: var(--blue); font-weight: bold; margin-top: 10px; }
        .BULLISH { border-color: var(--green); color: var(--green); background: rgba(63,185,80,0.1); }
        .row { display: flex; justify-content: space-between; font-size: 11px; color: #8b949e; margin-top: 10px; }
    </style>
</head>
<body>
    <h3 style="text-align: center; color: var(--blue);">💎 AI MARKET TERMINAL</h3>

    <div class="card">
        <div class="label">NIFTY 50</div>
        <div id="n-price" class="price">₹ --</div>
        <div class="row">
            <span>RSI: <b id="n-rsi">--</b></span>
            <span>SCORE: <b id="n-score">--</b>%</span>
        </div>
        <div id="n-signal" class="status-btn">SYNCING...</div>
    </div>

    <div class="card">
        <div class="label">SENSEX</div>
        <div id="s-price" class="price">₹ --</div>
        <div class="row">
            <span>RSI: <b id="s-rsi">--</b></span>
            <span>SCORE: <b id="s-score">--</b>%</span>
        </div>
        <div id="s-signal" class="status-btn">SYNCING...</div>
    </div>

    <p id="time" style="text-align: center; font-size: 10px; color: #484f58;">Connecting to Render...</p>

    <script>
        async function updateData() {
            try {
                const res = await fetch('https://ai-terminal-2.onrender.com/market_data');
                const data = await res.json();

                const setUI = (d, prefix) => {
                    document.getElementById(`${prefix}-price`).innerText = "₹ " + d.price;
                    document.getElementById(`${prefix}-rsi`).innerText = d.rsi;
                    document.getElementById(`${prefix}-score`).innerText = d.score;
                    const btn = document.getElementById(`${prefix}-signal`);
                    btn.innerText = d.signal;
                    btn.className = "status-btn " + (d.signal === "BULLISH" ? "BULLISH" : "");
                };

                setUI(data.nifty, 'n');
                setUI(data.sensex, 's');
                document.getElementById('time').innerText = "Last Sync: " + data.last_update;
            } catch (e) {
                document.getElementById('time').innerText = "Sync Error - Check Render Logs";
            }
        }
        setInterval(updateData, 10000);
        updateData();
    </script>
</body>
</html>
