<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI AUTO TRADER</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0b111e; color: white; font-family: sans-serif; text-align: center; }
        .card { background: #1a2332; margin: 10px; padding: 20px; border-radius: 10px; border-bottom: 2px solid #2ecc71; }
        .value { font-size: 24px; font-weight: bold; color: #2ecc71; }
        .label { color: #94a3b8; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>🤖 AI AUTO TRADER</h2>
    
    <div class="card">
        <div class="label">NIFTY</div>
        <div id="nifty" class="value">--</div>
    </div>

    <div class="card">
        <div class="label">SENSEX</div>
        <div id="sensex" class="value">--</div>
    </div>

    <div class="card">
        <div class="label">RSI: <span id="rsi">--</span></div>
        <div id="signal" class="value">WAITING...</div>
    </div>

    <script>
        // --- YEH BADLO: Firebase Console -> Project Settings se copy karein ---
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "apka-project.firebaseapp.com",
            databaseURL: "https://apka-project-default-rtdb.firebaseio.com",
            projectId: "apka-project",
            storageBucket: "apka-project.appspot.com",
            appId: "1:..."
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Real-time data update
        db.ref("market_data").on("value", (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById("nifty").innerText = data.nifty;
                document.getElementById("sensex").innerText = data.sensex;
                document.getElementById("rsi").innerText = data.rsi;
                document.getElementById("signal").innerText = data.signal;
            }
        });
    </script>
</body>
</html>
