<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PRO TERMINAL V33.0</title>
    <style>
        :root { --bg: #010409; --card: #0d1117; --green: #00ff88; --red: #ff3344; --blue: #2979ff; --gold: #ffd700; --purple: #bf40bf; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .container { max-width: 450px; margin: auto; padding: 12px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Portfolio Section */
        .portfolio { background: linear-gradient(145deg, #161b22, #0d1117); padding: 15px; border-radius: 16px; border: 1px solid var(--blue); display: flex; justify-content: space-between; align-items: center; }
        .p-val { font-size: 24px; font-weight: 900; }

        /* Card Styles */
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 20px; padding: 15px; border-left: 4px solid transparent; overflow: hidden; }
        .nifty-border { border-left-color: var(--blue); }
        .bank-border { border-left-color: var(--purple); }
        .sensex-border { border-left-color: var(--green); }
        .gift-border { border-left-color: var(--gold); }

        .price { font-size: 28px; font-weight: 900; margin: 5px 0; font-family: monospace; }
        
        /* TradingView Container */
        .tv-widget { height: 150px; margin-top: 10px; border-radius: 10px; overflow: hidden; border: 1px solid #21262d; }

        .buy-btn { background: none; border: 1px solid var(--green); color: var(--green); padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .buy-pe { border-color: var(--red); color: var(--red); }
    </style>
</head>
<body>

<div class="container">
    <div class="portfolio">
        <div>
            <div style="font-size: 10px; color: var(--blue);">LIVE P&L (VIRTUAL)</div>
            <div id="pnl-val" class="p-val">₹ 0.00</div>
            <div id="pos-info" style="font-size: 9px; color: #8b949e;">READY TO TRADE</div>
        </div>
        <button onclick="exitTrade()" style="background:var(--red); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold; font-size:11px;">EXIT</button>
    </div>

    <div class="card gift-border">
        <div style="color:var(--gold); font-size:11px; font-weight:bold;">GIFT NIFTY (GLOBAL)</div>
        <div id="g-price" class="price" style="color:var(--gold)">₹ 24,110.00</div>
        <div class="tv-widget">
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=SGX%3AIN1!&interval=1&theme=dark" width="100%" height="150" frameborder="0"></iframe>
        </div>
    </div>

    <div class="card nifty-border">
        <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--blue); font-size:11px; font-weight:bold;">NIFTY 50 (65 Lot)</span>
            <div>
                <button class="buy-btn" onclick="buy('NIFTY','CE',24100,120)">CE</button>
                <button class="buy-btn buy-pe" onclick="buy('NIFTY','PE',24100,115)">PE</button>
            </div>
        </div>
        <div id="n-price" class="price">₹ 24,050.00</div>
        <div class="tv-widget">
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=NSE%3ANIFTY&interval=1&theme=dark" width="100%" height="150" frameborder="0"></iframe>
        </div>
    </div>

    <div class="card bank-border">
        <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--purple); font-size:11px; font-weight:bold;">BANK NIFTY (30 Lot)</span>
            <div>
                <button class="buy-btn" onclick="buy('BANKNIFTY','CE',52500,240)">CE</button>
                <button class="buy-btn buy-pe" onclick="buy('BANKNIFTY','PE',52500,230)">PE</button>
            </div>
        </div>
        <div id="b-price" class="price">₹ 52,480.00</div>
        <div class="tv-widget">
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=NSE%3ABANKNIFTY&interval=1&theme=dark" width="100%" height="150" frameborder="0"></iframe>
        </div>
    </div>
</div>

<script>
    const LOTS = { NIFTY: 65, BANKNIFTY: 30, SENSEX: 20 };
    let p = { GIFT: 24110, NIFTY: 24050, BANKNIFTY: 52480 };
    let activeTrade = null;

    function update() {
        setInterval(() => {
            p.GIFT += (Math.random()*4-2);
            p.NIFTY += (Math.random()*6-3);
            p.BANKNIFTY += (Math.random()*20-10);

            document.getElementById('g-price').innerText = "₹ " + p.GIFT.toFixed(2);
            document.getElementById('n-price').innerText = "₹ " + p.NIFTY.toFixed(2);
            document.getElementById('b-price').innerText = "₹ " + p.BANKNIFTY.toFixed(2);
            
            if(activeTrade) {
                let currentPnL = (Math.random()*15-7.5) * activeTrade.lot;
                let el = document.getElementById('pnl-val');
                el.innerText = "₹ " + currentPnL.toFixed(2);
                el.style.color = currentPnL >= 0 ? "var(--green)" : "var(--red)";
            }
        }, 3000);
    }

    function buy(idx, type, strike, price) {
        activeTrade = { idx, type, strike, lot: LOTS[idx] };
        document.getElementById('pos-info').innerText = `ACTIVE: ${idx} ${type} (${activeTrade.lot} Qty)`;
        document.getElementById('pos-info').style.color = "var(--gold)";
    }

    function exitTrade() {
        activeTrade = null;
        document.getElementById('pnl-val').innerText = "₹ 0.00";
        document.getElementById('pnl-val').style.color = "#fff";
        document.getElementById('pos-info').innerText = "NO POSITION";
        document.getElementById('pos-info').style.color = "#8b949e";
    }

    update();
</script>
</body>
</html>
