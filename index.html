<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pro Terminal - Expert Edition</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        .container { max-width: 450px; margin: auto; background: #161b22; padding: 15px; border-radius: 20px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Meter Styling */
        .gauge-container { position: relative; width: 200px; height: 100px; margin: 20px auto; overflow: hidden; }
        .gauge-bg { position: absolute; width: 200px; height: 200px; border-radius: 50%; border: 15px solid #30363d; border-bottom-color: transparent; border-left-color: #f85149; border-right-color: #3fb950; box-sizing: border-box; }
        .needle { position: absolute; width: 4px; height: 80px; background: #ffffff; bottom: 0; left: 50%; transform-origin: bottom center; transform: rotate(-90deg); transition: transform 1s ease-in-out; border-radius: 4px; }
        .gauge-labels { display: flex; justify-content: space-between; width: 220px; margin: 0 auto; font-size: 10px; color: #8b949e; }

        .market-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .market-card { background: #21262d; padding: 12px; border-radius: 12px; border-left: 5px solid #58a6ff; text-align: left; }
        .price { font-size: 16px; font-weight: bold; color: #3fb950; display: block; margin-top: 5px; }
        #main-signal { font-size: 20px; font-weight: 900; margin: 15px 0; padding: 12px; background: #21262d; border-radius: 12px; border: 2px dashed #444; }
        .token-box { margin-top: 20px; padding: 15px; background: #1c2128; border-radius: 12px; }
        input { width: 80%; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; margin-bottom: 10px; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="color: #58a6ff; margin-bottom: 5px;">🚀 AI PRO Expert Terminal</h3>
    
    <div style="font-size: 12px; color: #c9d1d9; font-weight: bold;">MARKET MOOD METER</div>
    <div class="gauge-container">
        <div class="gauge-bg"></div>
        <div id="needle" class="needle"></div>
    </div>
    <div class="gauge-labels">
        <span>FEAR</span>
        <span>NEUTRAL</span>
        <span>GREED</span>
    </div>

    <div class="market-row">
        <div class="market-card" style="border-left-color: #3fb950;">
            <span style="font-size:10px; color:#8b949e;">NIFTY 50</span>
            <span id="nifty-price" class="price">0.00</span>
        </div>
        <div class="market-card" style="border-left-color: #ff7b72;">
            <span style="font-size:10px; color:#8b949e;">SENSEX</span>
            <span id="sensex-price" class="price">0.00</span>
        </div>
    </div>

    <div id="main-signal">CONNECTING...</div>

    <div class="token-box">
        <input type="password" id="token-input" placeholder="Paste Upstox Access Token">
        <button onclick="saveToken()">UPDATE BRIDGE</button>
    </div>

    <div id="update-time" style="font-size: 10px; color: #8b949e; margin-top: 15px;">Awaaz check karne ke liye screen par touch karein</div>
</div>

<script>
    const BRIDGE_URL = "https://ai-trminal.onrender.com/market-data";
    let lastSignal = "";

    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'hi-IN';
        window.speechSynthesis.speak(speech);
    }

    function saveToken() {
        const token = document.getElementById('token-input').value;
        if(token) {
            localStorage.setItem('upstox_token', token);
            speak("मीटर एक्टिवेट हो गया है");
            updateTerminal();
        }
    }

    async function updateTerminal() {
        const token = localStorage.getItem('upstox_token');
        if(!token) return;

        try {
            const res = await fetch(BRIDGE_URL + "?token=" + token);
            const responseData = await res.json();
            const nifty = responseData.data["NSE_INDEX:Nifty 50"].last_price;
            const sensex = (responseData.data["BSE_INDEX:SENSEX"] || responseData.data["NSE_INDEX:SENSEX"]).last_price;

            document.getElementById('nifty-price').innerText = nifty.toFixed(2);
            document.getElementById('sensex-price').innerText = sensex.toFixed(2);

            // Meter Logic (Nifty 24055 base)
            const needle = document.getElementById('needle');
            const diff = nifty - 24055;
            let angle = 0; // -90 (Fear) to 90 (Greed)
            
            if(diff > 50) angle = 70;
            else if(diff > 10) angle = 30;
            else if(diff < -50) angle = -70;
            else if(diff < -10) angle = -30;
            else angle = 0;

            needle.style.transform = `rotate(${angle}deg)`;

            // Signal & Voice
            const sigEl = document.getElementById('main-signal');
            let currentSignal = (nifty > 24055) ? "BULLISH" : "BEARISH";
            
            if(currentSignal !== lastSignal && lastSignal !== "") {
                speak(currentSignal === "BULLISH" ? "मार्केट में खरीदारी का मूड है" : "मार्केट में बिकवाली का प्रेशर है");
            }
            lastSignal = currentSignal;
            sigEl.innerText = currentSignal === "BULLISH" ? "🚀 STRONG BUY" : "🔻 SELL / WAIT";
            sigEl.style.color = currentSignal === "BULLISH" ? "#3fb950" : "#f85149";

            document.getElementById('update-time').innerText = "Live: " + new Date().toLocaleTimeString();
        } catch (e) { console.log("Error"); }
    }

    setInterval(updateTerminal, 5000);
    updateTerminal();
</script>

</body>
</html>
